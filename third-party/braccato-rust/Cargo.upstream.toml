[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/parsers",
    "crates/providers",
    "crates/engine",
    "crates/highlight",
    "crates/themes",
    "crates/slint",
    "crates/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/better-lyrics/braccato"
rust-version = "1.92"

[workspace.dependencies]
braccato-types = { path = "crates/types", version = "0.1.0" }
braccato-parsers = { path = "crates/parsers", version = "0.1.0" }
braccato-providers = { path = "crates/providers", version = "0.1.0" }
braccato-engine = { path = "crates/engine", version = "0.1.0" }
braccato-highlight = { path = "crates/highlight", version = "0.1.0" }
braccato-themes = { path = "crates/themes", version = "0.1.0" }
braccato-slint = { path = "crates/slint", version = "0.1.0" }
thiserror = "2"
regex = "1"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
slint = "1.18.1"
slint-build = "1.18.1"
rodio = "0.23"
rfd = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
