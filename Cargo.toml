[package]
name = "vey"
version = "0.1.16"
edition = "2021"
build = "build.rs"

[profile.release]
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "vey"
path = "src/main.rs"

[lib]
name = "playervf"
crate-type = ["rlib", "cdylib"]

[dependencies]
slint = { version = "1.18.1", features = ["backend-winit", "renderer-femtovg", "raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
base64 = "0.22"
sha1 = "0.10"
regex = "1"
unicode-segmentation = "1"
unicode-script = "0.5"
html-escape = "0.2"
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
yt-rust = { path = "third-party/yt-rust", default-features = false, features = ["youtube-music"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
opus-pure = "0.2.1"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.22"
walkdir = "2"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
rfd = "0.15"
arboard = { version = "3", default-features = false }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlAudioElement", "HtmlMediaElement", "Document", "Navigator", "Clipboard", "Location", "MediaError"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
jni = "0.21.1"

[package.metadata.android]
package = "com.playervf.rust"
resources = "android/res"
build_targets = ["aarch64-linux-android"]
[package.metadata.android.application]
label = "Vey"
icon = "@drawable/vey_logo"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
wry = "0.55.1"
tao = "0.35.3"
